apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 10s
    count: 2
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              containers:
              - name: metric-check
                image: alpine:3.18
                command: ["/bin/sh", "-c"]
                args:
                - |
                  RATE=$(cat /etc/config/error_rate || echo "0")
                  if [ "$RATE" -gt 5 ]; then
                    echo "High error rate detected ($RATE%)! Fails analysis."
                    exit 1
                  else
                    echo "Success rate OK ($RATE% errors)."
                    exit 0
                  fi
                volumeMounts:
                - name: config-volume
                  mountPath: /etc/config
              restartPolicy: Never
              volumes:
              - name: config-volume
                configMap:
                  name: metric-config
