apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-service
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
    spec:
      containers:
      - name: demo-service
        image: argoproj/rollouts-demo:blue
        ports:
        - containerPort: 8080
  strategy:
    canary:
      # Metrics analysis to run during the canary deployment
      analysis:
        templates:
        - templateName: success-rate
        startingStep: 2 # Start analysis after the first 20% pause
      steps:
      - setWeight: 20
      - pause: {duration: 10m}
      - setWeight: 40
      - pause: {duration: 10m}
      - setWeight: 60
      - pause: {duration: 10m}
      - setWeight: 80
      - pause: {duration: 10m}
