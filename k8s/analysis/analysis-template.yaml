apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 5m
    # Fail if success rate drops below 99%
    successCondition: result[0] >= 0.99
    # Tolerable number of failed queries before aborting rollout
    failureLimit: 2
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local:9090
        query: |
          sum(irate(
            http_requests_total{service="{{args.service-name}}", status=~"2.*|3.*"}[5m]
          )) 
          / 
          sum(irate(
            http_requests_total{service="{{args.service-name}}"}[5m]
          ))
