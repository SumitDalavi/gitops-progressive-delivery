name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release Catalog & Policy Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.65.0/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/

      - name: OPA Check & Test
        run: |
          opa check policies/
          opa test policies/ -v

      - name: Package Release Distribution Bundle
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz"
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='.terraform' -czf "/tmp/$ARCHIVE_NAME" .
          mv "/tmp/$ARCHIVE_NAME" .
          sha256sum "$ARCHIVE_NAME" > checksums.txt
          echo "Package created: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME" checksums.txt

      - name: Generate Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.event.repository.name }}-*.tar.gz
            checksums.txt
            sbom.spdx.json
