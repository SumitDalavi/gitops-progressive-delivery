name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  opa-test:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: curl -L -o opa https://openpolicyagent.org/downloads/v0.65.0/opa_linux_amd64_static
          && chmod +x opa && sudo mv opa /usr/local/bin/
      - name: OPA Check
        run: opa check policies/
      - name: OPA Test
        run: opa test policies/ -v
